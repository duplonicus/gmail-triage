[project]
name = "gmail-triage"
version = "0.1.0"
description = "Label, star and mark important new Gmail within seconds of arrival (Gmail watch -> Pub/Sub pull -> Claude Haiku)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-cloud-pubsub>=2.23",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmail-triage = "gmail_triage.daemon:main"
gmail-triage-auth = "gmail_triage.auth:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmail_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
